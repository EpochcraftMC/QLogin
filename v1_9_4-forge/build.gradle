plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

base {
    archivesName = "QLogin-1.9.4"
}

version = rootProject.mod_version
group = rootProject.maven_group

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
    mcVersion.set('1.9.4')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('24')
    username.set('Server')
}

sourceSets {
    main {
        java {
            srcDir "src/main/java"
        }
        resources {
            srcDir "src/main/resources"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
    maven {
        name 'SpongePowered'
        url 'https://repo.spongepowered.org/maven'
    }
}

dependencies {
    // SQLite driver
    implementation 'org.xerial:sqlite-jdbc:' + rootProject.sqlite_jdbc_version

    // Mixin (compile-time only, provided by Cleanroom/Forge at runtime)
    compileOnly 'org.spongepowered:mixin:0.8.2'
}

// Bundle SQLite into jar
jar {
    from {
        configurations.runtimeClasspath.findAll {
            it.name.contains('sqlite')
        }.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("mcmod.info") {
        expand "version": project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}