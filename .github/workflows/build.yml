# ============================================================
# QLogin v1_26_1_2-neoforge standalone build
# Branch: v1.26.1.2-neoforge | Java: 21
# ============================================================
name: Build v1_26_1_2-neoforge

on:
  push:
    branches: [ "main", "v1.26.1.2-neoforge" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'MODRINTH.md'
  workflow_dispatch:

jobs:
  build:
    name: "Build v1_26_1_2-neoforge"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :v1_26_1_2-neoforge:build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1_26_1_2-neoforge
          path: v1_26_1_2-neoforge/build/libs/*.jar
          if-no-files-found: warn