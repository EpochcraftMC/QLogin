# ============================================================
# QLogin v1_9-forge standalone build
# Branch: v1.12.2-forge | Java: 8
# ============================================================
name: Build v1_9-forge

on:
  push:
    branches: [ "main", "v1.12.2-forge" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'MODRINTH.md'
  workflow_dispatch:

jobs:
  build:
    name: "Build v1_9-forge"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :v1_9-forge:build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1_9-forge
          path: v1_9-forge/build/libs/*.jar
          if-no-files-found: warn