# ============================================================
# QLogin v1_21_1-fabric standalone build
# Branch: main | Java: 21
# ============================================================
name: Build v1_21_1-fabric

on:
  push:
    branches: [ "main", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'MODRINTH.md'
  workflow_dispatch:

jobs:
  build:
    name: "Build v1_21_1-fabric"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew : --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1_21_1-fabric
          path: v1_21_1-fabric/build/libs/*.jar
          if-no-files-found: warn