# ============================================================
# QLogin paper-plugin standalone build (Maven)
# Branch: paper-plugin
# ============================================================
name: Build paper-plugin

on:
  push:
    branches: [ "main", "paper-plugin" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'MODRINTH.md'
  workflow_dispatch:

jobs:
  build:
    name: "Build paper-plugin"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        run: |
          cd paper-plugin
          mvn clean package -q

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-plugin
          path: paper-plugin/target/*.jar
          if-no-files-found: warn