# ============================================================
# QLogin v1_20_4-forge standalone build
# Branch: v1.20.4-forge | Java: 17
# ============================================================
name: Build v1_20_4-forge

on:
  push:
    branches: [ "main", "v1.20.4-forge" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'MODRINTH.md'
  workflow_dispatch:

jobs:
  build:
    name: "Build v1_20_4-forge"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :v1_20_4-forge:build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1_20_4-forge
          path: v1_20_4-forge/build/libs/*.jar
          if-no-files-found: warn