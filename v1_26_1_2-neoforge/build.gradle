plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

base {
    archivesName = "${rootProject.archives_base_name}-26.1.2-neoforge"
}

version = rootProject.mod_version
group = rootProject.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

minecraft {
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }
}

sourceSets {
    main {
        java {
            srcDir "src/main/java"
        }
        resources {
            srcDir "src/main/resources"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${rootProject.neoforge_26_1_2}"

    implementation 'org.xerial:sqlite-jdbc:' + rootProject.sqlite_jdbc_version
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'QLogin',
            'Specification-Vendor'    : 'aqing',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'QLogin-26.1.2-NeoForge',
            'Implementation-Version'  : rootProject.mod_version,
            'Implementation-Vendor'   : 'aqing'
        ])
    }
}

processResources {
    inputs.property "version", rootProject.mod_version
    filteringCharset "UTF-8"
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": rootProject.mod_version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

// Bundle SQLite driver into jar
jar {
    from {
        configurations.runtimeClasspath.findAll {
            it.name.contains('sqlite')
        }.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}