pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'ForgeGradle'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases/' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/maven' }
        maven { name = 'GTNH Maven'; url = 'https://nexus.gtnewhorizons.com/repository/public/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' apply false
    id 'net.neoforged.gradle.userdev' version '7.0.+' apply false
}

rootProject.name = 'loginmod'

// ==================== Single-version branch ====================
// This branch builds only one MC version, independently.
// Build: gradlew :{module}:build
include 'v1_12_2-forge'
